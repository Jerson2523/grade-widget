name: Build app

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon -PdataUrl=https://raw.githubusercontent.com/${{ github.repository }}/main/data/grades.json
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Grades.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Grades-apk
          path: Grades.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Grades app (build ${{ github.run_number }})
          body: Download Grades.apk on your phone and open it to install.
          files: Grades.apk
          make_latest: true
