plugins {
    id 'com.android.application'
}

def dataUrl = project.findProperty('dataUrl') ?: 'https://raw.githubusercontent.com/OWNER/grade-widget/main/data/grades.json'

android {
    namespace 'com.gradewidget'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gradewidget'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'DATA_URL', "\"${dataUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
